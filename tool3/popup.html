<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JobAssist Pro</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --success: #22c55e;
            --error: #ef4444;
        }
        body {
            width: 380px;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .logo {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .badge {
            background: #334155;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-dim);
        }
        .main-card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
        }
        .btn-primary {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            margin-bottom: 12px;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            width: 100%;
            background: transparent;
            color: var(--text);
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-secondary:hover { background: #334155; }

        .status-container {
            margin-top: 16px;
            background: #0f172a;
            border-radius: 12px;
            padding: 12px;
            font-size: 13px;
            border-left: 4px solid var(--primary);
            display: none;
            max-height: 120px;
            overflow-y: auto;
            position: relative;
        }
        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid #334155;
            color: var(--text-dim);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
            z-index: 10;
        }
        .copy-btn:hover {
            background: #334155;
            color: var(--text);
        }
        .log-line {
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            word-break: break-all;
        }
        .dot { height: 6px; width: 6px; background: var(--primary); border-radius: 50%; display: inline-block; flex-shrink: 0; }
        
        .tab-content { margin-top: 20px; }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 11px;
            color: var(--text-dim);
            opacity: 0.8;
        }
        
        /* Fixed Emoji display issues */
        .icon { font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">JobAssist Pro</div>
        <div class="badge">V2.0 AI-POWERED</div>
    </div>

    <div class="main-card">
        <button id="magicFillBtn" class="btn-primary">
            <span class="icon">✨</span> Smart Autofill
        </button>
        
        <button id="scanSiteBtn" class="btn-secondary">
            <span class="icon">🔍</span> Deep Scan Page
        </button>

        <button id="aiBridgeBtn" class="btn-primary" style="background: linear-gradient(to right, #818cf8, #c084fc); margin-top: 12px;">
            <span class="icon">🤖</span> AI Bridge Fill
        </button>

        <div id="statusArea" class="status-container">
            <button id="copyLogsBtn" class="copy-btn">Copy</button>
            <div id="logContent"></div>
        </div>
    </div>

    <div id="aiAnalysis" class="tab-content" style="display:none;">
        <div style="font-size: 11px; margin-bottom: 8px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px;">System Analysis:</div>
        <div id="analysisResult" style="background:rgba(15, 23, 42, 0.6); padding:12px; border-radius:12px; font-size:12px; border: 1px solid #334155; line-height: 1.5;"></div>
    </div>

    <div id="questionsArea" class="tab-content" style="display:none; margin-top: 16px;">
        <div style="font-size: 11px; margin-bottom: 8px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px;">Pending Questions:</div>
        <div id="questionsList" style="background:#1e293b; padding:12px; border-radius:12px; font-size:12px; border: 1px solid var(--primary); display: flex; flex-direction: column; gap: 8px;">
        </div>
    </div>

    <div id="attachmentNotice" class="tab-content" style="display:none; margin-top: 16px;">
        <div style="background:rgba(34, 197, 94, 0.1); padding:12px; border-radius:12px; font-size:12px; border: 1px solid var(--success); color: var(--success); display: flex; align-items: center; gap: 10px;">
            <span class="icon" style="font-size: 18px;">📎</span>
            <div><strong>Found Attachment Field:</strong><br/>Please upload: <em>SalmanAgha_AI_2026.pdf</em></div>
        </div>
    </div>

    <div class="footer">
        Intelligently mapping form patterns & career engines...
    </div>

    <script src="popup.js"></script>
</body>
</html>
